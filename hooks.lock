# The library commit whose plugin/hooks/ tree this plugin vendors.
# CI diffs plugin/hooks against that SHA byte for byte, with no transforms at all.
# There is no generated hooks.json here: Cursor reads its hook config from
# ~/.cursor/hooks.json rather than from a plugin manifest -- measured, a manifest hooks
# key did not fire -- so bin/install.py writes the entries and tools/generate.py is not
# used for this host.
repo=memvara/memvara
sha=eb25ea028e9f70372d2da7903215636a40df320a
path=plugin/hooks
host=cursor
